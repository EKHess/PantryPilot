{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>Settings</h1><p>Make PantryPilot work your way.</p></div></div><section class="panel settings"><h2>Restocking</h2><form id="settings-form"><label>Default restock threshold<input name="restock_threshold" type="number" min="0" value="{{settings.restock_threshold}}"></label><label>Default target quantity<input name="default_target_quantity" type="number" min="0" value="{{settings.default_target_quantity}}"></label><label>Theme<select name="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label><button class="button">Save settings</button></form></section>{% endblock %}
